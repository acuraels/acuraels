
name: Update GitHub profile visuals

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/profile-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-visuals
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: 'user=acuraels&theme=tokyonight&hide_border=true&background=0D1117&ring=00D9FF&fire=8B5CF6&currStreakLabel=00D9FF&sideLabels=C9D1D9'
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate animated contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: acuraels
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            profile/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300D9FF&color_dots=%230D1117,%231A1B4B,%23312E81,%2306B6D4,%238B5CF6

      - name: Commit generated images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg profile/github-contribution-grid-snake-dark.svg

          if git diff --cached --quiet; then
            echo "No image changes."
            exit 0
          fi

          git commit -m "chore: update profile visuals"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Profile visuals updated successfully!"
              exit 0
            fi

            echo "Push rejected. Retrying..."
            sleep 3
          done

          echo "Failed to push generated images."
          exit 1
